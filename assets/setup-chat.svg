<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-label="What setup asks, one question at a time"><rect width="960" height="630" rx="14" fill="#ffffff" stroke="#D8DAE2"/><text x="30" y="44" font-size="20" fill="#01010D" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">What setup asks, one question at a time</text><rect x="760.8" y="70" width="169.2" height="38" rx="12" fill="#6331FB"/><text x="778.8" y="94" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">set up talent one</text><rect x="30" y="120" width="556.8" height="38" rx="12" fill="#F4F6FE" stroke="#D8DAE2"/><text x="48" y="144" font-size="14" fill="#01010D" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Which company is this for, and its website? I confirm, never assume.</text><rect x="601.2" y="170" width="328.8" height="38" rx="12" fill="#6331FB"/><text x="619.2" y="194" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Northwind Robotics, northwind.example.</text><rect x="30" y="220" width="556.8" height="58" rx="12" fill="#F4F6FE" stroke="#D8DAE2"/><text x="48" y="244" font-size="14" fill="#01010D" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">I found what it does and where it hires. Which functions and levels,</text><text x="48" y="264" font-size="14" fill="#01010D" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">and roughly how many hires a year?</text><rect x="472.0" y="290" width="458.0" height="38" rx="12" fill="#6331FB"/><text x="490.0" y="314" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Software and Mechanical, mid to staff, about 20 a year.</text><rect x="30" y="340" width="496.0" height="38" rx="12" fill="#F4F6FE" stroke="#D8DAE2"/><text x="48" y="364" font-size="14" fill="#01010D" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Any rule every candidate must meet, like work authorization?</text><rect x="456.8" y="390" width="473.2" height="38" rx="12" fill="#6331FB"/><text x="474.8" y="414" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Must be authorized to work in the US without sponsorship.</text><rect x="30" y="440" width="564.4" height="38" rx="12" fill="#F4F6FE" stroke="#D8DAE2"/><text x="48" y="464" font-size="14" fill="#01010D" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Light or dark documents? Want to connect a research tool or your ATS?</text><rect x="624.0" y="490" width="306.0" height="38" rx="12" fill="#6331FB"/><text x="642.0" y="514" font-size="14" fill="#ffffff" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Light. Skip the connectors for now.</text><rect x="30" y="540" width="465.59999999999997" height="38" rx="12" fill="#F4F6FE" stroke="#D8DAE2"/><text x="48" y="564" font-size="14" fill="#01010D" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">Saved. Ask for any of the nine documents in plain words.</text><text x="30" y="612" font-size="13" fill="#5A5D68" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="start">An illustration of the conversation, not a screenshot. Your answers will differ.</text></svg>
